services:
  - type: web
    name: blogify-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard — your MongoDB Atlas URI
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard — a strong random string
    healthCheckPath: /api/blogs
